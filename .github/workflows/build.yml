name: Build Frontend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: build-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # fromJSON('0') needed — bare 0 is falsy in GitHub expressions
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && fromJSON('0') || 1 }}
          fetch-tags: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun ci

      - name: Build
        run: bun run build

      - name: Get version from package.json
        if: github.event_name == 'workflow_dispatch'
        id: get_version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        if: github.event_name == 'workflow_dispatch'
        id: release_notes
        run: |
          previous_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$previous_tag" ]; then
            git log --pretty=format:"* %s (%h)" > release_notes.txt
          else
            git log --pretty=format:"* %s (%h)" "$previous_tag"..HEAD > release_notes.txt
          fi

          delimiter="NOTES_$(openssl rand -hex 16)"
          {
            echo "notes<<$delimiter"
            tr -d '\r' < release_notes.txt
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Zip dist folder
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd dist
          zip -r ../${{ steps.get_version.outputs.version }}.zip .

      - name: Zip wait-for-app-html folder
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd scripts/wait-for-app-html
          zip -r ../../wait-for-app-html.zip .

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ steps.get_version.outputs.version }}"
          name: "Release ${{ steps.get_version.outputs.version }}"
          body: ${{ steps.release_notes.outputs.notes }}
          files: |
            ${{ steps.get_version.outputs.version }}.zip
            wait-for-app-html.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
