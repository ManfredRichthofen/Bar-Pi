name: Build Bundle (Frontend + Backend)

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: build-bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun ci

      - name: Build frontend
        run: bun run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          retention-days: 3
          if-no-files-found: error

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Download modules
        working-directory: backend-go
        run: go mod download

      - name: Run backend tests
        working-directory: backend-go
        run: go test -v ./...

  build-bundle:
    needs: [build-frontend, test-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            outfile: bar-pi-bundle-linux-amd64
          - goarch: arm64
            outfile: bar-pi-bundle-linux-arm64
          - goarch: arm
            goarm: "7"
            outfile: bar-pi-bundle-linux-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist

      - name: Embed frontend
        run: |
          rm -rf backend-go/internal/static/dist
          mkdir -p backend-go/internal/static/dist
          cp -r dist/* backend-go/internal/static/dist/

      - name: Download modules
        working-directory: backend-go
        run: go mod download

      - name: Build ${{ matrix.outfile }}
        working-directory: backend-go
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          mkdir -p ../dist-backend
          go build -tags=bundle -ldflags="-s -w" \
            -o "../dist-backend/${{ matrix.outfile }}" \
            ./cmd/server/main.go

      - name: Stage binary for upload
        run: |
          mkdir -p staged
          cp "dist-backend/${{ matrix.outfile }}" "staged/${{ matrix.outfile }}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.outfile }}
          path: staged/
          retention-days: 14
          if-no-files-found: error

  collect:
    needs: build-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: dist-backend
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist-backend

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bundle-binaries
          path: dist-backend/
          retention-days: 14
          if-no-files-found: error
