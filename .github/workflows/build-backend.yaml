name: Build Backend Only

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend-go/**"
      - ".github/workflows/build-backend.yaml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "backend-go/**"
      - ".github/workflows/build-backend.yaml"
  workflow_dispatch:

concurrency:
  group: build-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Download modules
        working-directory: backend-go
        run: go mod download

      - name: Run tests
        working-directory: backend-go
        run: go test -v ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            outfile: bar-pi-server-linux-amd64
          - goarch: arm64
            outfile: bar-pi-server-linux-arm64
          - goarch: arm
            goarm: "7"
            outfile: bar-pi-server-linux-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Download modules
        working-directory: backend-go
        run: go mod download

      - name: Build ${{ matrix.outfile }}
        working-directory: backend-go
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          mkdir -p ../dist-backend
          go build -ldflags="-s -w" -o "../dist-backend/${{ matrix.outfile }}" ./cmd/server/main.go

      - name: Stage binary for upload
        run: |
          mkdir -p staged
          cp "dist-backend/${{ matrix.outfile }}" "staged/${{ matrix.outfile }}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ matrix.outfile }}
          path: staged/
          retention-days: 14
          if-no-files-found: error

  collect:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: backend-*
          path: dist-backend
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist-backend

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v7
        with:
          name: backend-binaries
          path: dist-backend/
          retention-days: 14
          if-no-files-found: error
