name: Create Release

on:
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      notes: ${{ steps.release_notes.outputs.notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Get version from package.json
        id: get_version
        run: |
          version=$(bun pm pkg get version | tr -d '"')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version: $version"

      - name: Generate Release Notes
        id: release_notes
        run: |
          previous_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$previous_tag" ]; then
            git log --pretty=format:"* %s (%h)" > release_notes.txt
          else
            git log --pretty=format:"* %s (%h)" "$previous_tag"..HEAD > release_notes.txt
          fi

          {
            echo "notes<<EOF"
            cat release_notes.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-backend:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: backend-go/go.sum

      - name: Install frontend dependencies
        run: bun ci

      - name: Build frontend
        run: bun run build

      - name: Zip frontend
        run: |
          cd dist
          zip -r ../frontend-${{ needs.meta.outputs.version }}.zip .

      - name: Zip wait-for-app-html
        run: |
          cd scripts/wait-for-app-html
          zip -r ../../wait-for-app-html.zip .

      - name: Prepare backend build directory
        run: |
          rm -rf dist-backend
          mkdir -p dist-backend

      - name: Install backend dependencies
        working-directory: backend-go
        run: |
          go mod download
          go mod tidy

      - name: Build backend - Linux AMD64
        working-directory: backend-go
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o ../dist-backend/bar-pi-server-linux-amd64 ./cmd/server/main.go

      - name: Build backend - Linux ARM64
        working-directory: backend-go
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o ../dist-backend/bar-pi-server-linux-arm64 ./cmd/server/main.go

      - name: Build backend - Linux ARM
        working-directory: backend-go
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: 7
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o ../dist-backend/bar-pi-server-linux-arm ./cmd/server/main.go

      - name: Prepare bundle build
        run: |
          rm -rf backend-go/internal/static/dist
          mkdir -p backend-go/internal/static/dist
          cp -r dist/* backend-go/internal/static/dist/

      - name: Build bundle - Linux AMD64
        working-directory: backend-go
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -tags=bundle -ldflags="-s -w" -o ../dist-backend/bar-pi-bundle-linux-amd64 ./cmd/server/main.go

      - name: Build bundle - Linux ARM64
        working-directory: backend-go
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build -tags=bundle -ldflags="-s -w" -o ../dist-backend/bar-pi-bundle-linux-arm64 ./cmd/server/main.go

      - name: Build bundle - Linux ARM
        working-directory: backend-go
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: 7
          CGO_ENABLED: 0
        run: go build -tags=bundle -ldflags="-s -w" -o ../dist-backend/bar-pi-bundle-linux-arm ./cmd/server/main.go

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v7
        with:
          name: backend-and-frontend
          path: |
            dist-backend/
            frontend-${{ needs.meta.outputs.version }}.zip
            wait-for-app-html.zip
          if-no-files-found: error

  build-android:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;28.2.13676358"

      - name: Install frontend dependencies
        run: bun ci

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_FILE }}" | tr -d '\n\r\t ' | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          ls -lh "$GITHUB_WORKSPACE/release.keystore"

      - name: Build Android Release APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export NDK_HOME="${ANDROID_HOME}/ndk/28.2.13676358"
          bunx tauri android build --apk

      - name: Prepare APK artifact
        run: |
          mkdir -p release-apk
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -path "*/release/*" | head -n 1)
          echo "Found APK: $apk"
          cp "$apk" release-apk/app-release.apk
          ls -lh release-apk/app-release.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: release-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun ci

      - name: Build Windows installer
        run: bunx tauri build

      - name: Prepare Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-windows | Out-Null
          $installer = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          Copy-Item $installer.FullName release-windows/Bar-Pi-Setup.exe
          Get-Item release-windows/Bar-Pi-Setup.exe

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: release-windows/Bar-Pi-Setup.exe
          if-no-files-found: error

  release:
    needs: [meta, build-backend, build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download backend and frontend
        uses: actions/download-artifact@v7
        with:
          name: backend-and-frontend
          path: artifacts

      - name: Download Android APK
        uses: actions/download-artifact@v7
        with:
          name: android-apk
          path: artifacts

      - name: Download Windows installer
        uses: actions/download-artifact@v7
        with:
          name: windows-installer
          path: artifacts

      - name: Verify release files
        run: |
          find artifacts -type f -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          name: Release v${{ needs.meta.outputs.version }}
          body: |
            ## Bar-Pi Release v${{ needs.meta.outputs.version }}

            Complete release with all deployment options.

            ### Windows Desktop
            - `Bar-Pi-Setup.exe` - Tauri thin client (connects to a reachable backend)

            ### Android App
            - `app-release.apk` - Tauri thin client to run with the backend server

            ### Complete Bundle (Recommended)
            Single binary with embedded frontend - just download and run!
            - `bar-pi-bundle-linux-amd64` - Linux x86_64
            - `bar-pi-bundle-linux-arm64` - Raspberry(Arm64) Pi 64-bit
            - `bar-pi-bundle-linux-arm` - Raspberry(Arm) Pi 32-bit

            ### Backend Only
            API server without embedded frontend (deploy frontend separately use the apk or host elsewhere)
            - `bar-pi-server-linux-amd64` - Linux x86_64
            - `bar-pi-server-linux-arm64` - Raspberry(Arm64) Pi 64-bit
            - `bar-pi-server-linux-arm` - Raspberry(Arm) Pi 32-bit

            ### Frontend Only
            - `frontend-${{ needs.meta.outputs.version }}.zip` - Web application files
            - `wait-for-app-html.zip` - Loading screen

            ### Changes
            ${{ needs.meta.outputs.notes }}

            ### Quick Start - Bundle
            See the [INSTALL_GUIDE.md](INSTALL_GUIDE.md) for detailed installation instructions.
          files: |
            artifacts/Bar-Pi-Setup.exe
            artifacts/app-release.apk
            artifacts/dist-backend/bar-pi-bundle-linux-amd64
            artifacts/dist-backend/bar-pi-bundle-linux-arm64
            artifacts/dist-backend/bar-pi-bundle-linux-arm
            artifacts/dist-backend/bar-pi-server-linux-amd64
            artifacts/dist-backend/bar-pi-server-linux-arm64
            artifacts/dist-backend/bar-pi-server-linux-arm
            artifacts/frontend-${{ needs.meta.outputs.version }}.zip
            artifacts/wait-for-app-html.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
