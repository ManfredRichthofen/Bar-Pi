name: Create Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION_FILE: package.json

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      notes: ${{ steps.release_notes.outputs.notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get version from package.json
        id: get_version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version: $version"

      - name: Generate Release Notes
        id: release_notes
        run: |
          previous_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$previous_tag" ]; then
            git log --pretty=format:"* %s (%h)" > release_notes.txt
          else
            git log --pretty=format:"* %s (%h)" "$previous_tag"..HEAD > release_notes.txt
          fi

          delimiter="NOTES_$(openssl rand -hex 16)"
          {
            echo "notes<<$delimiter"
            tr -d '\r' < release_notes.txt
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  build-frontend:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ${{ env.BUN_VERSION_FILE }}

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun ci

      - name: Build frontend
        run: bun run build

      - name: Zip frontend
        run: |
          cd dist
          zip -r ../frontend-${{ needs.meta.outputs.version }}.zip .

      - name: Zip wait-for-app-html
        run: |
          cd scripts/wait-for-app-html
          zip -r ../../wait-for-app-html.zip .

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: |
            dist/
            frontend-${{ needs.meta.outputs.version }}.zip
            wait-for-app-html.zip
          if-no-files-found: error
          retention-days: 3

  build-go:
    needs: [ meta, build-frontend ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: server
            goarch: amd64
            outfile: bar-pi-server-linux-amd64
          - variant: server
            goarch: arm64
            outfile: bar-pi-server-linux-arm64
          - variant: server
            goarch: arm
            goarm: "7"
            outfile: bar-pi-server-linux-arm
          - variant: bundle
            goarch: amd64
            outfile: bar-pi-bundle-linux-amd64
          - variant: bundle
            goarch: arm64
            outfile: bar-pi-bundle-linux-arm64
          - variant: bundle
            goarch: arm
            goarm: "7"
            outfile: bar-pi-bundle-linux-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Download frontend
        if: matrix.variant == 'bundle'
        uses: actions/download-artifact@v8
        with:
          name: frontend
          path: .

      - name: Embed frontend for bundle
        if: matrix.variant == 'bundle'
        run: |
          rm -rf backend-go/internal/static/dist
          mkdir -p backend-go/internal/static/dist
          cp -r dist/* backend-go/internal/static/dist/

      - name: Download Go modules
        working-directory: backend-go
        run: go mod download

      - name: Build ${{ matrix.outfile }}
        working-directory: backend-go
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          mkdir -p ../dist-backend
          tags_flag=""
          if [ "${{ matrix.variant }}" = "bundle" ]; then
            tags_flag="-tags=bundle"
          fi
          go build $tags_flag \
            -ldflags="-s -w -X github.com/ManfredRichthofen/Bar-Pi/backend-go/internal/version.Version=${{ needs.meta.outputs.version }}" \
            -o "../dist-backend/${{ matrix.outfile }}" \
            ./cmd/server/main.go

      - name: Stage binary for upload
        run: |
          mkdir -p staged
          cp "dist-backend/${{ matrix.outfile }}" "staged/${{ matrix.outfile }}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: go-${{ matrix.outfile }}
          path: staged/
          if-no-files-found: error
          retention-days: 3

  collect-backend:
    needs: [ meta, build-frontend, build-go ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download Go binaries
        uses: actions/download-artifact@v8
        with:
          pattern: go-*
          path: dist-backend
          merge-multiple: true

      - name: Download frontend zips
        uses: actions/download-artifact@v8
        with:
          name: frontend
          path: .

      - name: Generate checksums
        working-directory: dist-backend
        run: |
          ls -lh
          sha256sum bar-pi-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload backend and frontend artifacts
        uses: actions/upload-artifact@v7
        with:
          name: backend-and-frontend
          path: |
            dist-backend/
            frontend-${{ needs.meta.outputs.version }}.zip
            wait-for-app-html.zip
          if-no-files-found: error
          retention-days: 3

  build-android:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ${{ env.BUN_VERSION_FILE }}

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: android-release
          cache-on-failure: true

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Android NDK
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: ${{ runner.os }}-android-ndk-28.2.13676358

      - name: Setup Android NDK
        run: |
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "${ANDROID_NDK_LATEST_HOME}" ]; then
            echo "Using pre-installed NDK: ${ANDROID_NDK_LATEST_HOME}"
            echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
          else
            NDK_VERSION="28.2.13676358"
            if [ ! -d "${ANDROID_HOME}/ndk/${NDK_VERSION}" ]; then
              for attempt in 1 2 3; do
                rm -rf "${ANDROID_HOME}/.temp"
                if sdkmanager --install "ndk;${NDK_VERSION}"; then
                  break
                fi
                echo "Attempt ${attempt} failed, retrying..."
                sleep 5
              done
            fi
            echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Install frontend dependencies
        run: bun ci

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_FILE }}" | tr -d '\n\r\t ' | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          ls -lh "$GITHUB_WORKSPACE/release.keystore"

      - name: Build Android Release APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bunx tauri android build --apk

      - name: Prepare APK artifact
        run: |
          mkdir -p release-apk
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -path "*/release/*" | head -n 1)
          echo "Found APK: $apk"
          cp "$apk" release-apk/app-release.apk
          ls -lh release-apk/app-release.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: release-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3

  build-windows:
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ${{ env.BUN_VERSION_FILE }}

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-release
          cache-on-failure: true

      - name: Install frontend dependencies
        run: bun ci

      - name: Build Windows installer
        run: bunx tauri build

      - name: Prepare Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-windows | Out-Null
          $installer = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          Copy-Item $installer.FullName release-windows/Bar-Pi-Setup.exe
          Get-Item release-windows/Bar-Pi-Setup.exe

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: release-windows/Bar-Pi-Setup.exe
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [ meta, collect-backend, build-android, build-windows ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download backend and frontend
        uses: actions/download-artifact@v8
        with:
          name: backend-and-frontend
          path: artifacts

      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: artifacts

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: artifacts

      - name: Verify release files
        run: |
          find artifacts -type f -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          name: Release v${{ needs.meta.outputs.version }}
          body: |
            ## Bar-Pi Release v${{ needs.meta.outputs.version }}

            Complete release with all deployment options.

            ### Windows Desktop
            - `Bar-Pi-Setup.exe` - Tauri thin client (connects to a reachable backend)

            ### Android App
            - `app-release.apk` - Tauri thin client to run with the backend server

            ### Complete Bundle (Recommended)
            Single binary with embedded frontend - just download and run!
            - `bar-pi-bundle-linux-amd64` - Linux x86_64
            - `bar-pi-bundle-linux-arm64` - Raspberry(Arm64) Pi 64-bit
            - `bar-pi-bundle-linux-arm` - Raspberry(Arm) Pi 32-bit

            ### Backend Only
            API server without embedded frontend (deploy frontend separately use the apk or host elsewhere)
            - `bar-pi-server-linux-amd64` - Linux x86_64
            - `bar-pi-server-linux-arm64` - Raspberry(Arm64) Pi 64-bit
            - `bar-pi-server-linux-arm` - Raspberry(Arm) Pi 32-bit

            `SHA256SUMS` contains checksums for all Linux binaries (used by the built-in auto updater).

            ### Frontend Only
            - `frontend-${{ needs.meta.outputs.version }}.zip` - Web application files
            - `wait-for-app-html.zip` - Loading screen

            ### Changes
            ${{ needs.meta.outputs.notes }}

            ### Quick Start - Bundle
            See the [INSTALL_GUIDE.md](INSTALL_GUIDE.md) for detailed installation instructions.
          files: |
            artifacts/Bar-Pi-Setup.exe
            artifacts/app-release.apk
            artifacts/dist-backend/bar-pi-bundle-linux-amd64
            artifacts/dist-backend/bar-pi-bundle-linux-arm64
            artifacts/dist-backend/bar-pi-bundle-linux-arm
            artifacts/dist-backend/bar-pi-server-linux-amd64
            artifacts/dist-backend/bar-pi-server-linux-arm64
            artifacts/dist-backend/bar-pi-server-linux-arm
            artifacts/dist-backend/SHA256SUMS
            artifacts/frontend-${{ needs.meta.outputs.version }}.zip
            artifacts/wait-for-app-html.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
